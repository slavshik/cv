# Build, check and publish to GitHub Pages.
#
# Publishing waits for green checks: the repository holds sources only, and
# what goes to Pages is built here and committed nowhere.
#
# The artefact is uploaded from the container job rather than the fast one,
# because that is where a browser exists — and the PDF has to be inside dist/
# before it is uploaded.

name: pages

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: types, linter, unit tests, weight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: types
              run: npm run typecheck

            - name: linter
              run: npm run lint

            - name: formatting
              run: npm run format:check

            - name: unit tests
              run: npm run test:unit

            - name: build
              run: npx vite build

            - name: weight budget
              run: node test/size.mjs

    build:
        name: pdf and screenshots
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble
        steps:
            - uses: actions/checkout@v4

            # Chromium picks the typeface for the PDF and the screenshots, and
            # this image has no Palatino-class serif — see the comment on
            # --serif in src/styles.css. `make e2e` installs the same package,
            # and the baselines only mean something while the two agree.
            - name: fonts
              run: apt-get update -qq && apt-get install -y -qq fonts-texgyre

            - run: npm ci

            - name: build
              run: npx vite build

            - name: render the pdf
              env:
                  CV_PHONE: ${{ secrets.CV_PHONE }}
              run: node scripts/pdf.mjs

            - name: screenshot tests
              run: npx playwright test

            - name: report, if anything moved
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 7

            - name: artefact for publishing
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        needs: [check, build]
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
